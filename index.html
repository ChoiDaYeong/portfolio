<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustrator PixelPusher</title>
  <meta name="description" content="Subculture Character Illustrations & Game UI/UX Design">
  <meta name="robots" content="index, follow">
  <meta name="author" content="PixelPusher">
  <meta name="theme-color" content="#75d6a6">
  <link rel="canonical" href="https://pixelpu5her.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PixelPusher">
  <meta property="og:title" content="Illustrator PixelPusher">
  <meta property="og:description" content="Subculture Character Illustrations & Game UI/UX Design">
  <meta property="og:url" content="https://pixelpu5her.com/">

  <meta property="og:image:alt" content="PixelPusher character illustration portfolio preview">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Illustrator PixelPusher">
  <meta name="twitter:description" content="Subculture Character Illustrations & Game UI/UX Design">
  <meta name="twitter:image" content="https://pixelpu5her.com/img/01.webp">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap;}
    @font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');font-weight:900;font-display:swap;}
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#f8f7f4;--bg2:#f0ede8;
      --text:#022a55;--muted:#92a2b3;--accent:#75d6a6;--accent-dark:#3faa78;
      --border:rgba(2,42,85,0.1);--f:'Paperlogy',sans-serif;
      --nav-h:52px;
    }
    html,body{height:100%;}
    body{background:var(--bg);color:var(--text);font-family:var(--f);font-weight:500;font-size:1em;line-height:1.4;}
    h1,h2,h3,h4,h5,h6{font-family:var(--f);font-weight:900;}

    /* ── NAV ── */
    nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(248,247,244,0.93);backdrop-filter:blur(12px);border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:var(--nav-h);}
    .nav-anchors{display:flex;}
    .nav-anchor{font-size:0.75em;font-weight:500;letter-spacing:0.1em;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--f);padding:0 18px;height:var(--nav-h);display:flex;align-items:center;transition:color 0.2s,border-color 0.2s;text-decoration:none;}
    .nav-anchor:hover{color:var(--text);}
    .nav-anchor.active{color:var(--accent-dark);border-bottom-color:var(--accent);}
    .nav-title{font-weight:900;font-size:1em;color:var(--accent);letter-spacing:0.04em;border-bottom:2px solid transparent !important;}

    /* ── PAGE WRAP ── */
    .page-wrap{padding-top:var(--nav-h);}

    /* ── LANDING ── */
    #landing{min-height:calc(100vh - var(--nav-h));display:grid;grid-template-columns:repeat(12,minmax(0,1fr));overflow:hidden;border-bottom:0.5px solid var(--border);background:var(--bg);}
    .landing-info{grid-column:span 3;min-width:0;display:flex;align-items:flex-end;padding:32px 32px 52px;border-right:0.5px solid var(--border);}
    .slide-content{width:100%;}
    .slide-logo{display:block;width:auto;height:auto;max-width:250px;margin-bottom:20px;}
    .slide-eyebrow{font-size:0.65em;letter-spacing:0.2em;color:var(--accent-dark);margin-bottom:28px;display:block;text-transform:uppercase;}
    .landing-ctas{display:flex;flex-direction:column;gap:14px;}
    .cta-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .cta-row-label{font-size:0.65em;letter-spacing:0.18em;color:var(--muted);min-width:48px;text-transform:uppercase;}
    .cta-divider{width:100%;height:0.5px;background:var(--border);}
    .cta-btn{font-size:0.8em;font-weight:500;letter-spacing:0;padding:12px 28px;border:0.5px solid;cursor:pointer;font-family:var(--f);transition:border-color 0.3s,background-color 0.6s,color 0.3s;text-decoration:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
    .cta-primary{border-color:var(--accent-dark);color:var(--accent-dark);background:none;}
    .cta-primary:hover{background:var(--accent);border-color:var(--accent);color:var(--bg);}
    .cta-secondary{border-color:var(--border);color:var(--muted);background:none;}
    .cta-secondary:hover{background:var(--accent);border-color:var(--accent);color:var(--bg);}
    .cta-ghost{border-color:var(--border);color:var(--muted);background:none;}
    .cta-ghost:hover{background:var(--accent);border-color:var(--accent);color:var(--bg);}
    .cta-btn svg{width:14px;height:14px;flex-shrink:0;}
    .links-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    #landing-links .sns-btn,#landing-links .cta-btn{min-width:48%;justify-content:center;}
    #contact-links .links-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;}
    #contact-links .sns-btn,#contact-links .cta-btn{width:100%;min-width:0;justify-content:center;padding:12px 0;}
    .sns-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 28px;border:0.5px solid var(--border);background:none;cursor:pointer;text-decoration:none;transition:border-color 0.3s,background-color 0.6s,color 0.3s;font-family:var(--f);font-size:0.8em;font-weight:500;color:var(--muted);}
    .sns-btn svg{width:14px;height:14px;fill:currentColor;transition:fill 0.2s;flex-shrink:0;}
    .sns-label{white-space:nowrap;}
    .sns-btn:hover{background:var(--accent);border-color:var(--accent);color:var(--bg);}
    .landing-gallery{grid-column:span 9;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1px;min-height:calc(100vh - var(--nav-h));background:var(--border);}
    .landing-gallery-item{position:relative;min-width:0;min-height:0;overflow:hidden;border:0;background:var(--bg2);cursor:pointer;font-family:var(--f);color:var(--text);}
    .landing-gallery-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.45s ease;}
    .landing-gallery-item:hover img{transform:scale(1.04);}
    .landing-gallery-caption{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 16px;background:linear-gradient(to top,rgba(248,247,244,0.9),rgba(248,247,244,0));text-align:left;opacity:0;transform:translateY(6px);transition:opacity 0.22s,transform 0.22s;}
    .landing-gallery-item:hover .landing-gallery-caption{opacity:1;transform:translateY(0);}
    .landing-gallery-title{display:block;font-weight:900;font-size:0.95em;line-height:1.25;color:var(--text);}
    .landing-gallery-sub{display:block;font-size:0.72em;color:var(--muted);margin-top:3px;line-height:1.35;}

    /* ── EVENTS ── */
    #events{border-bottom:0.5px solid var(--border);}
    #events .section-header{border-bottom:0;}
    .events-wrap{padding:0 32px 42px;}
    .events-board{display:grid;grid-template-columns:minmax(250px,1fr) minmax(220px,0.9fr);gap:0;background:transparent;margin-top:0;}
    .events-board.has-next{grid-template-columns:minmax(250px,1fr) minmax(220px,0.9fr) minmax(260px,1fr);}
    .event-panel{background:var(--bg);min-height:280px;padding:24px 22px;}
    .event-kicker{font-size:0.65em;letter-spacing:0.18em;color:var(--accent-dark);text-transform:uppercase;margin-bottom:8px;}
    .event-title-link{display:block;color:inherit;text-decoration:none;}
    .event-title-link:hover .event-title{color:var(--accent-dark);}
    .event-title-link:hover .event-link-icon{color:var(--accent-dark);}
    .event-link-icon{width:0.9em;height:0.9em;color:var(--muted);display:inline-block;vertical-align:-0.08em;margin-left:7px;transition:color 0.2s;}
    .event-title{font-weight:900;font-size:1.55em;color:var(--text);line-height:1.18;}
    .event-date{font-size:0.95em;color:var(--accent-dark);margin-top:8px;}
    .event-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:22px 0 18px;}
    .event-field-label{font-size:0.65em;letter-spacing:0.16em;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
    .event-field-value{font-size:0.92em;color:var(--text);line-height:1.5;}
    .event-note{grid-column:1/-1;color:var(--muted);}
    .event-actions{display:flex;gap:8px;flex-wrap:wrap;}
    .event-sale-btn{font-family:var(--f);font-weight:500;font-size:0.8em;letter-spacing:0.1em;padding:12px 28px;border:0.5px solid;background:none;display:inline-flex;align-items:center;gap:7px;}
    .event-sale-btn svg{width:14px;height:14px;}
    .event-sale-btn.available{border-color:var(--accent-dark);color:var(--accent-dark);cursor:pointer;transition:border-color 0.3s,background-color 0.6s,color 0.3s;}
    .event-sale-btn.available:hover{background:var(--accent);border-color:var(--accent);color:var(--bg);}
    .event-sale-btn.disabled{border-color:var(--border);color:var(--muted);cursor:default;pointer-events:none;}
    .event-preview-btn{width:100%;height:100%;min-height:232px;display:block;position:relative;border:0;background:var(--bg2);cursor:pointer;overflow:hidden;font-family:var(--f);color:var(--text);}
    .event-preview-btn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 0.4s ease;}
    .event-preview-btn:hover img{transform:scale(1.04);}
    .event-preview-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--bg2);}
    .event-preview-overlay{position:absolute;inset:0;background:rgba(248,247,244,0.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;transition:opacity 0.22s;}
    .event-preview-btn:hover .event-preview-overlay{opacity:1;}
    .event-preview-title{font-weight:900;font-size:1.5em;}
    .event-preview-sub{font-size:1.2em;color:var(--muted);}
    .next-event-panel{border-left:1px solid var(--border);}
    .next-event-list{display:flex;flex-direction:column;border-top:0.5px solid var(--border);margin-top:14px;}
    .next-event-row{display:grid;grid-template-columns:82px 1fr;gap:12px;padding:13px 0;border-bottom:0.5px solid var(--border);}
    .next-event-date{font-size:0.76em;color:var(--accent-dark);line-height:1.4;}
    .next-event-title{font-weight:900;font-size:0.9em;color:var(--text);line-height:1.35;}
    .next-event-place{font-size:0.76em;color:var(--muted);margin-top:2px;}
    .next-event-empty{height:170px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.95em;}
    /* SECTION */
    .section-header{padding:40px 32px 20px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:0.5px solid var(--border);}
    .section-header h2{font-weight:900;font-size:2em;color:var(--accent);text-transform:uppercase;letter-spacing:0.04em;}
    .g-zoom-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin-top:2px;}

    /* ── LIGHTBOX ── */
    .lightbox{position:fixed;inset:0;z-index:999;background:rgba(248,247,244,0.97);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s;}
    .lightbox.open{opacity:1;pointer-events:auto;}
    .lb-inner{display:flex;align-items:stretch;max-width:88vw;max-height:88vh;position:relative;border:0.5px solid var(--border);}
    .lb-img-wrap{width:auto;max-height:88vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);overflow:hidden;min-width:220px;min-height:280px;}
    .lb-img-wrap img{max-width:100%;max-height:88vh;display:block;object-fit:contain;}
    .lb-placeholder{width:100%;height:100%;min-height:340px;display:flex;align-items:center;justify-content:center;}
    .lb-placeholder-inner{text-align:center;}
    .lb-placeholder-title{font-weight:900;font-size:1.4em;color:var(--text);margin-bottom:6px;}
    .lb-placeholder-sub{font-size:0.85em;color:var(--muted);}
    .lb-info{width:260px;min-width:220px;padding:32px 28px;background:var(--bg);display:flex;flex-direction:column;justify-content:flex-start;border-left:0.5px solid var(--border);overflow-y:auto;}
    .lb-tag{font-size:0.65em;letter-spacing:0.18em;color:var(--accent-dark);margin-bottom:12px;text-transform:uppercase;}
    .lb-title{font-weight:900;font-size:1.3em;color:var(--accent);margin-bottom:4px;line-height:1.2;}
    .lb-sub{font-size:0.85em;color:var(--muted);margin-bottom:14px;line-height:1.4;}
    .lb-shop-btn{display:inline-flex;align-items:center;gap:6px;font-size:0.8em;font-weight:500;letter-spacing:0.06em;padding:12px 28px;border:0.5px solid var(--accent-dark);color:var(--accent-dark);background:none;cursor:pointer;font-family:var(--f);transition:border-color 0.3s,background-color 0.6s,color 0.3s;text-decoration:none;margin-bottom:14px;}
    .lb-shop-btn:hover{background:var(--accent);border-color:var(--accent);color:var(--bg);}
    .lb-shop-btn svg{width:14px;height:14px;}
    .lb-desc{font-size:0.9em;color:var(--text);line-height:1.6;margin-bottom:20px;}
    .lb-year{font-size:0.8em;color:var(--muted);padding-top:14px;border-top:0.5px solid var(--border);}
    .lb-close{position:absolute;top:12px;right:14px;font-size:1.1em;color:var(--muted);cursor:pointer;background:none;border:none;font-family:var(--f);font-weight:500;transition:color 0.2s;line-height:1;z-index:10;}
    .lb-close:hover{color:var(--text);}
    .lb-nav{position:fixed;top:50%;transform:translateY(-50%);font-size:1em;color:var(--muted);cursor:pointer;background:transparent;border:0;font-family:var(--f);padding:12px 14px;transition:color 0.2s;z-index:1000;display:flex;align-items:center;justify-content:center;}
    .lb-nav svg{width:36px;height:36px;display:block;}
    .lb-prev svg{transform:rotate(180deg);}
    .lb-nav:hover{color:var(--accent-dark);}
    .lb-prev{left:16px;}.lb-next{right:16px;}

    /* ── CONTACT ── */
    #contact{border-bottom:0.5px solid var(--border);}
    .comm-center{max-width:600px;margin:0 auto;padding:48px 32px;}
    .comm-center>p{font-size:1em;color:var(--text);line-height:1.4;margin-bottom:20px;}
    .mail-actions{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
    .mail-copy-link{display:inline-flex;align-items:center;gap:4px;color:var(--accent-dark);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer;font-weight:500;transition:color 0.2s;white-space:nowrap;}
    .mail-copy-link svg{flex-shrink:0;}
    .mail-copy-link:hover{color:var(--accent);}
    .copy-inline-feedback{font-size:0.8em;color:var(--accent-dark);font-weight:500;margin-left:4px;opacity:0;transition:opacity 0.3s;pointer-events:none;}
    .copy-inline-feedback.show{opacity:1;}
    .contact-form{display:flex;flex-direction:column;gap:12px;}
    .form-row{display:flex;flex-direction:column;gap:4px;}
    .form-label{font-size:0.9em;color:var(--muted);letter-spacing:0.04em;}
    .form-input,.form-textarea{font-family:var(--f);font-weight:500;font-size:0.9em;color:var(--text);background:var(--bg);border:0.5px solid var(--border);padding:10px 14px;transition:border-color 0.2s;outline:none;width:100%;line-height:1.4;}
    .form-input:focus,.form-textarea:focus{border-color:var(--accent);}
    .form-textarea{resize:vertical;min-height:90px;}
    .form-actions{display:flex;gap:10px;align-items:center;margin-top:4px;}
    .form-submit{font-family:var(--f);font-weight:500;font-size:0.8em;letter-spacing:0.1em;padding:12px 28px;border:0.5px solid var(--accent-dark);color:var(--accent-dark);background:none;cursor:pointer;transition:border-color 0.3s,background-color 0.6s,color 0.3s;display:inline-flex;align-items:center;gap:7px;}
    .form-submit svg{width:14px;height:14px;}
    .form-submit:hover{background:var(--accent);border-color:var(--accent);color:var(--bg);}
    .form-error{margin-top:12px;font-size:0.88em;color:#c0392b;line-height:1.5;}
    .form-error a{color:#c0392b;font-weight:500;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer;}
    .form-error a:hover{color:var(--accent-dark);}

    /* ── MODAL ── */
    .modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(2,42,85,0.18);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s;}
    .modal-overlay.open{opacity:1;pointer-events:auto;}
    .modal-box{background:var(--bg);border:0.5px solid var(--border);padding:40px 36px;max-width:400px;text-align:center;}
    .modal-icon{margin-bottom:14px;display:flex;justify-content:center;}
    .modal-icon svg{fill:var(--accent-dark);}
    .modal-title{font-weight:900;font-size:1.1em;color:var(--accent);margin-bottom:10px;}
    .modal-msg{font-size:0.95em;color:var(--text);line-height:1.6;margin-bottom:24px;}
    .modal-close{font-family:var(--f);font-weight:500;font-size:0.8em;letter-spacing:0.08em;padding:12px 28px;border:0.5px solid var(--border);background:none;color:var(--muted);cursor:pointer;transition:border-color 0.3s,background-color 0.6s,color 0.3s;}
    .modal-close:hover{background:var(--accent);border-color:var(--accent);color:var(--bg);}

    /* ── FOOTER ── */
    footer{padding:22px 32px;border-top:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    footer span{font-size:0.75em;color:var(--muted);font-weight:500;letter-spacing:0.04em;}

    @media(max-width:1024px){
      #landing-links .sns-btn,#landing-links .cta-btn{width:100%;min-width:100%;}
    }

    /* ── MOBILE ── */
    @media(max-width:640px){
      nav{padding:0 16px;}
      .nav-anchor{padding:0 12px;font-size:0.7em;}
      #landing{min-height:calc(100svh - var(--nav-h));display:flex;flex-direction:column;}
      .landing-info{min-height:42svh;padding:24px 20px 28px;border-right:0;border-bottom:0.5px solid var(--border);}
      .slide-logo{width:auto;height:auto;max-width:180px;}
      .landing-gallery{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));min-height:58svh;}
      .landing-gallery-item:nth-child(n+5){display:none;}
      .landing-gallery-caption{opacity:1;transform:none;padding:14px 12px 12px;}
      .landing-gallery-title{font-size:0.82em;}
      .landing-gallery-sub{display:none;}
      .section-header{flex-direction:column;align-items:flex-start;gap:12px;padding:28px 20px 16px;}
      .events-wrap{padding:0 20px 32px;}
      .events-board,.events-board.has-next{grid-template-columns:1fr;}
      .event-panel{min-height:unset;padding:22px 18px;}
      .event-title{font-size:1.35em;}
      .event-info{grid-template-columns:1fr;gap:10px;}
      .event-sale-btn{width:100%;justify-content:center;}
      .event-preview-btn{min-height:280px;}
      .event-preview-overlay{opacity:1;background:linear-gradient(to top,rgba(247,248,244,0.85) 0%,rgba(247,248,244,0) 42%,rgba(247,248,244,0) 90%);display:grid;grid-template-columns:1fr auto;align-items:end;justify-content:stretch;padding:20px;gap:14px;}
      .event-preview-overlay .event-preview-title{color:var(--text);line-height:1.1;}
      .event-preview-overlay .event-preview-sub{display:none;}
      .event-preview-overlay .g-zoom-icon svg path{fill:#022a55;}
      .event-preview-overlay .g-zoom-icon{align-self:end;justify-self:end;margin-top:0;}
      .next-event-panel{border-left:0;border-top:1px solid var(--border);}
      .next-event-row{grid-template-columns:78px 1fr;}
      .comm-center{padding:32px 20px;}
      .lb-inner{flex-direction:column;max-width:96vw;}
      .lb-img-wrap{width:96vw;min-width:unset;min-height:220px;}
      .lb-info{width:100%;border-left:none;border-top:0.5px solid var(--border);padding:20px;}
      .lb-nav{display:none;}
      footer{flex-direction:column;gap:6px;align-items:flex-start;padding:20px;}
      .links-row{flex-direction:column;align-items:stretch;gap:8px;}
      #contact-links .links-row{grid-template-columns:1fr;}
      .links-row .cta-row-label{margin-bottom:2px;}
      .sns-btn,.cta-btn.cta-ghost,.cta-btn.cta-secondary{display:flex;width:100%;justify-content:center;padding:12px 28px;font-size:0.8em;}
      .sns-btn svg{width:16px;height:16px;}
    }
  </style>

  /* ── 갤러리 데이터 ──
     각 항목 편집 방법:
       thumb   : 썸네일 파일명 (img/ 폴더 기준, 예: matilda_thumb.webp)
       image   : 원본 파일명  (img/ 폴더 기준, 예: matilda.webp)
       type    : 'illustration' | 'uiux' | 'graphic'
       tags    : ['able-shop'] 추가 시 구매하기 버튼 노출
       shopUrl : 구매 링크 URL
       desc    : 라이트박스 상세 설명
       ※ dashboard를 통해 편집하는 것을 권장합니다.
  */
  function getSeoulDateKey(){
    const parts=new Intl.DateTimeFormat('en-CA',{
      timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'
    }).formatToParts(new Date()).reduce((acc,p)=>{acc[p.type]=p.value;return acc;},{});
    return `${parts.year}-${parts.month}-${parts.day}`;
  }
  function dateKeyToNum(dateKey){return Number(dateKey.replaceAll('-',''));}
  function formatEventDate(startDate,endDate){
    const start=startDate.replaceAll('-','.');
    if(!endDate||endDate===startDate) return start;
    const s=startDate.split('-'), e=endDate.split('-');
    if(s[0]===e[0]&&s[1]===e[1]) return `${s[0]}.${s[1]}.${s[2]}-${e[2]}`;
    if(s[0]===e[0]) return `${s[0]}.${s[1]}.${s[2]}-${e[1]}.${e[2]}`;
    return `${start}-${endDate.replaceAll('-','.')}`;
  }
  function getEventState(event,todayNum){
    const start=dateKeyToNum(event.startDate);
    const end=dateKeyToNum(event.endDate||event.startDate);
    if(todayNum>=start&&todayNum<=end) return 'now';
    if(todayNum<start) return 'next';
    return 'recent';
  }
  function getFeaturedEvent(){
    const todayNum=dateKeyToNum(getSeoulDateKey());
    const normalized=events.map(event=>({...event,state:getEventState(event,todayNum)}));
    const current=normalized.find(event=>event.state==='now');
    if(current) return current;
    const upcoming=normalized.filter(event=>event.state==='next').sort((a,b)=>a.startDate.localeCompare(b.startDate))[0];
    if(upcoming) return upcoming;
    return normalized.filter(event=>event.state==='recent').sort((a,b)=>b.endDate.localeCompare(a.endDate))[0];
  }
  function eventStatusLabel(state){
    if(state==='now') return 'Now Event';
    if(state==='next') return 'Next Event';
    return 'Recent Event';
  }
  const DEFAULT_NOTICE_URL='https://www.instagram.com/pixelpu5her/';
  function buildEventActions(event){
    const shopUrl=event.shopUrl||DEFAULT_NOTICE_URL;
    const label=event.shopButtonLabel||'구매하기';
    if(event.shopAvailable){
      return `<button class="event-sale-btn available" type="button" onclick="window.open('${shopUrl}','_blank','noopener')">${ic('ic-cart')} ${label}</button>`;
    }
    return `<button class="event-sale-btn disabled" type="button" disabled>${label}</button>`;
  }
  function getUpcomingEvents(featured){
    const todayNum=dateKeyToNum(getSeoulDateKey());
    return events
      .map(event=>({...event,state:getEventState(event,todayNum)}))
      .filter(event=>event.state==='next'&&(event.title!==featured.title||event.startDate!==featured.startDate))
      .sort((a,b)=>a.startDate.localeCompare(b.startDate));

  function renderEvents(){
    const board=document.getElementById('events-board');
    if(!events.length){
      board.innerHTML='<div class="event-panel next-event-empty" style="grid-column:1/-1;">Coming Soon!</div>';
      return;
    }
    const featured=getFeaturedEvent();
    if(!featured){
      board.innerHTML='<div class="event-panel next-event-empty" style="grid-column:1/-1;">Coming Soon!</div>';
      return;
    }
    const dateText=formatEventDate(featured.startDate,featured.endDate);
    const todayText=getSeoulDateKey().replaceAll('-','.');
    const upcoming=getUpcomingEvents(featured);
    const hasNext=upcoming.length>0;
    const titleUrl=featured.titleUrl||featured.noticeUrl||DEFAULT_NOTICE_URL;
    const thumbnailUrl=featured.thumbnailUrl||featured.noticeUrl||DEFAULT_NOTICE_URL;
    const nextHtml=hasNext
      ?upcoming.slice(0,4).map(event=>`
        <div class="next-event-row">
          <div class="next-event-date">${formatEventDate(event.startDate,event.endDate)}</div>
          <div>
            <div class="next-event-title">${event.title}</div>
            <div class="next-event-place">${event.venue}</div>
          </div>
        </div>`).join('')
      :'<div class="next-event-empty">Coming Soon!</div>';
    board.classList.toggle('has-next',hasNext);
    board.innerHTML=`
      <div class="event-panel">
        <a class="event-title-link" href="${titleUrl}" target="_blank">
          <div class="event-kicker">${eventStatusLabel(featured.state)} · KST ${todayText} 기준</div>
          <div class="event-title">${featured.title}<svg class="event-link-icon" viewBox="0 0 16 16" aria-hidden="true"><use href="#ic-up-right-circle"/></svg></div>
          <div class="event-date">${dateText}</div>
        </a>
        <div class="event-info">
          <div>
            <div class="event-field-label">Venue</div>
            <div class="event-field-value">${featured.venue}${featured.booth?` (부스 ${featured.booth})`:''}</div>
          </div>
          <div class="event-note">
            <div class="event-field-label">Items</div>
            <div class="event-field-value">${featured.items||featured.note}</div>
          </div>
          <div class="event-note">
            <div class="event-field-label">Status</div>
            <div class="event-field-value">${featured.salesStatusText||featured.note}</div>
          </div>
        </div>
        <div class="event-actions">${buildEventActions(featured)}</div>
      </div>
      <div class="event-panel">
        <a class="event-preview-btn" href="${thumbnailUrl}" target="_blank" aria-label="${featured.title} 인스타 공지로 이동">
          ${featured.previewImage?`<img src="${featured.previewImage}" alt="${featured.title} 행사 안내 썸네일" loading="lazy" decoding="async">`:''}
          ${featured.previewImage?'':`<div class="event-preview-fallback">
            <div>
              <div class="event-preview-title">${featured.title}</div>
              <div class="event-preview-sub">Info image coming soon</div>
            </div>
          </div>`}
          <div class="event-preview-overlay">
            <div class="event-preview-title">인포 보기</div>
            <div class="event-preview-sub">인스타로 이동</div>
            <div class="g-zoom-icon">${ZOOM_SVG}</div>
          </div>
        </a>
      </div>
      ${hasNext?`<div class="event-panel next-event-panel">
        <div class="event-kicker">Next Schedule</div>
        <div class="next-event-list">${nextHtml}</div>
      </div>`:''}`;
  }

  let filteredWorks=[...works], lbIndex=0;

  /* ── 라이트박스 ── */
  function openLightbox(idx){
    lbIndex=idx; updateLightbox();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow='';
  }
  function lbNav(dir){
    lbIndex=(lbIndex+dir+filteredWorks.length)%filteredWorks.length;
    updateLightbox();
  }
  function updateLightbox(){
    const w=filteredWorks[lbIndex];
    const typeLabels={illustration:'Original Artwork',uiux:'UI/UX Design',graphic:'Graphic Design'};
    document.getElementById('lb-tag').textContent=typeLabels[w.type]||'Original Artwork';
    document.getElementById('lb-title').textContent=w.title;
    document.getElementById('lb-sub').textContent=w.sub;
    document.getElementById('lb-desc').textContent=w.desc||'';
    document.getElementById('lb-year').textContent=w.year;
    const shopBtn=document.getElementById('lb-shop-btn');
    const hasShop=w.tags&&w.tags.includes('able-shop')&&w.shopUrl;
    shopBtn.style.display=hasShop?'inline-flex':'none';
    if(hasShop) shopBtn.href=w.shopUrl;
    const ph=document.getElementById('lb-placeholder');
    ph.style.background=w.color;
    ph.innerHTML=w.image
      ?`<img src="${w.image}" alt="${w.title}" loading="lazy" decoding="async" style="max-width:100%;max-height:88vh;display:block;object-fit:contain;">`
      :`<div class="lb-placeholder-inner"><div class="lb-placeholder-title">${w.title}</div><div class="lb-placeholder-sub">${w.sub} · ${w.year}</div></div>`;
  }
  document.getElementById('lightbox').addEventListener('click',e=>{
    if(e.target===document.getElementById('lightbox')) closeLightbox();
  });
  document.addEventListener('keydown',e=>{
    if(!document.getElementById('lightbox').classList.contains('open')) return;
    if(e.key==='Escape') closeLightbox();
    if(e.key==='ArrowLeft') lbNav(-1);
    if(e.key==='ArrowRight') lbNav(1);
  });

  /* ── 폼 오류 메시지 표시 헬퍼 ── */
  function showFormError(html){
    const el=document.getElementById('form-error');
    el.innerHTML=html;
    el.style.display='block';
  }
  function clearFormError(){
    const el=document.getElementById('form-error');
    el.innerHTML='';
    el.style.display='none';
  }

  /* ── 폼 (Formspree 연동 + honeypot) ── */
  async function submitForm(){
    const name=document.getElementById('f-name').value.trim();
    const email=document.getElementById('f-email').value.trim();
    const deadline=document.getElementById('f-deadline').value.trim();
    const message=document.getElementById('f-message').value.trim();
    const honey=document.getElementById('f-honey').value;

    if(honey) return;
    if(!name||!email||!message){
      showFormError('성함, 메일, 내용은 필수 항목입니다.');
      return;
    }
    clearFormError();

    const btn=document.querySelector('.form-submit');
    btn.disabled=true;
    btn.textContent='전송 중...';

    try{
      const res=await fetch('https://formspree.io/f/xpqylorr',{
        method:'POST',
        headers:{'Accept':'application/json','Content-Type':'application/json'},
        body:JSON.stringify({name,email,deadline:deadline||'미정',message})
      });

      if(res.ok){
        clearFormError();
        document.getElementById('f-name').value='';
        document.getElementById('f-email').value='';
        document.getElementById('f-deadline').value='';
        document.getElementById('f-message').value='';
        document.getElementById('modal').classList.add('open');
      } else {
        const data=await res.json().catch(()=>({}));
        const errors=data.errors||[];
        const isEmailError=errors.some(e=>e.field==='email'||e.code==='TYPE_EMAIL'||(e.message&&e.message.toLowerCase().includes('email')));
        const isRateLimit=res.status===429;

        if(isEmailError){
          showFormError('메일 형식이 잘못되었습니다. 다시 입력해주세요.');
        } else if(isRateLimit){
          showFormError(`한도가 초과되었습니다. <a onclick="copyMailInline(this);return false;" href="#">메일 주소만 직접 복사</a> 링크를 이용해주세요.`);
        } else {
          showFormError('전송에 실패했습니다. 잠시 후 다시 이용해주세요.');
        }
      }
    } catch(e){
      showFormError('전송에 실패했습니다. 잠시 후 다시 이용해주세요.');
    } finally {
      btn.disabled=false;
      btn.innerHTML=`<svg width="14" height="14" viewBox="0 0 16 16"><use href="#ic-send"/></svg> 메일 보내기`;
    }
  }
  function closeModal(){document.getElementById('modal').classList.remove('open');}
  function copyMailInline(el){
    event.preventDefault();
    navigator.clipboard.writeText(getMailParts()).then(()=>{
      const fb=document.getElementById('copy-inline-feedback');
      fb.classList.add('show');
      setTimeout(()=>fb.classList.remove('show'),2000);
    });
  }

  /* ── 앵커 스크롤 ── */
  function goTo(id){document.getElementById(id).scrollIntoView({behavior:'smooth'});}
  document.querySelectorAll('.nav-anchor').forEach(btn=>{
    btn.addEventListener('click',()=>goTo(btn.dataset.target));
  });

  /* ── IntersectionObserver — 앵커 하이라이트 ── */
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        document.querySelectorAll('.nav-anchor:not(.nav-title)').forEach(b=>b.classList.remove('active'));
        const a=document.querySelector(`.nav-anchor[data-target="${entry.target.id}"]`);
        if(a) a.classList.add('active');
      }
    });
  },{threshold:0.3});
  ['events','contact'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) observer.observe(el);
  });

  /* ── Init ── */
  initLanding();
  renderEvents();
</script>
