<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PixelPusher Dashboard</title><style>
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap;}@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');font-weight:900;font-display:swap;}*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f8f7f4;--bg2:#f0ede8;--bg3:#e8e4de;--text:#022a55;--muted:#92a2b3;--accent:#75d6a6;--accent-dark:#3faa78;--danger:#e05252;--border:rgba(2,42,85,.1);--f:'Paperlogy',sans-serif}body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:14px;line-height:1.5}h1,h2,h3{font-weight:900}header{height:52px;padding:0 32px;border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:20}.header-title{font-weight:900;color:var(--accent)}.header-actions,.event-save-row{display:flex;gap:10px;align-items:center}.btn{font-family:var(--f);font-size:.8em;padding:10px 20px;border:.5px solid;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn-primary{border-color:var(--accent-dark);color:var(--accent-dark)}.btn-secondary{border-color:var(--border);color:var(--muted)}.btn-danger{border-color:var(--danger);color:var(--danger)}.save-status{font-size:.75em;color:var(--muted)}.save-status.saved{color:var(--accent-dark)}.save-status.error{color:var(--danger)}.tab-bar{height:44px;padding:0 32px;border-bottom:.5px solid var(--border);display:flex;background:var(--bg);position:sticky;top:52px;z-index:19}.tab-btn{font-family:var(--f);font-size:.8em;letter-spacing:.06em;padding:0 20px;border:none;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer}.tab-btn.active{color:var(--accent-dark);border-bottom-color:var(--accent)}.tab-pane{display:none}.tab-pane.active{display:flex}.gallery-layout{display:grid;grid-template-columns:340px 1fr;width:100%;height:calc(100vh - 96px)}.list-panel{border-right:.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden}.list-header{padding:16px 20px;border-bottom:.5px solid var(--border)}.list-header h2{font-size:.85em;color:var(--muted);font-weight:500;letter-spacing:.08em;text-transform:uppercase}.list-body{flex:1;overflow-y:auto;padding:8px 0}.work-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;border-left:2px solid transparent;user-select:none}.work-item:hover,.work-item.active{background:var(--bg2)}.work-item.active{border-left-color:var(--accent)}.work-item.dragging{opacity:.4}.work-item.drag-over{border-top:2px solid var(--accent)}.work-num{font-size:.7em;color:var(--muted);min-width:22px;text-align:right}.work-thumb-preview,.work-thumb-color{width:36px;height:48px;border:.5px solid var(--border);background:var(--bg3);flex-shrink:0;object-fit:cover}.work-info{flex:1;min-width:0}.work-item-title{font-weight:900;font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.work-item-sub{font-size:.75em;color:var(--muted)}.work-item-badge{font-size:.65em;padding:2px 7px;border-radius:2px;white-space:nowrap}.badge-illustration{background:#ede8f5;color:#6a4aaa}.badge-uiux{background:#e4eaee;color:#2a6a8a}.badge-graphic{background:#eee8e4;color:#8a5a2a}.drag-handle{color:var(--muted);cursor:grab}.add-btn{width:calc(100% - 40px);margin:8px 20px;padding:12px 20px;border:.5px dashed var(--border);background:none;color:var(--muted);font-family:var(--f);cursor:pointer}.edit-panel,.events-layout{flex:1;overflow-y:auto;padding:32px}.edit-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px}.edit-empty-icon{font-size:2.5em;opacity:.3}.edit-form,.events-form{max-width:760px}.edit-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.edit-title-row h2{font-size:1.2em}.field-group{margin-bottom:20px}.field-label{display:block;font-size:.78em;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}.field-label span{color:var(--danger)}.field-input,.field-textarea,.field-select{font-family:var(--f);font-size:.9em;color:var(--text);background:var(--bg);border:.5px solid var(--border);padding:9px 13px;outline:none;width:100%;line-height:1.4}.field-input:focus,.field-textarea:focus,.field-select:focus{border-color:var(--accent)}.field-textarea{resize:vertical;min-height:84px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.preview-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-top:8px}.img-preview{width:72px;height:96px;object-fit:cover;border:.5px solid var(--border);background:var(--bg3)}.img-preview-wide{width:128px;height:72px;object-fit:cover;border:.5px solid var(--border);background:var(--bg3)}.img-preview-placeholder,.img-preview-wide-placeholder{width:72px;height:96px;border:.5px solid var(--border);background:var(--bg3);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:.65em}.img-preview-wide-placeholder{width:128px;height:72px}.shop-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:10px}.shop-toggle input{width:15px;height:15px;accent-color:var(--accent-dark)}.color-row{display:flex;gap:10px;align-items:center}.color-swatch{width:36px;height:36px;border:.5px solid var(--border)}.color-swatch input{opacity:0;width:100%;height:100%;cursor:pointer}.event-card{max-width:820px;border-top:.5px solid var(--border);padding-top:24px;margin-top:18px}.event-list-actions{display:flex;gap:8px;margin-top:12px}.toast{position:fixed;bottom:28px;right:28px;background:var(--text);color:#fff;padding:12px 20px;font-size:.82em;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;z-index:100}.toast.show{opacity:1;transform:translateY(0)}.toast.error{background:var(--danger)}
</style></head><body><header><span class="header-title">&#80;&#105;&#120;&#101;&#108;&#80;&#117;&#115;&#104;&#101;&#114; &#44288;&#47532; &#45824;&#49884;&#48372;&#46300;</span><div class="header-actions"><span class="save-status" id="save-status">&#48520;&#47084;&#50724;&#45716; &#51473;...</span><button class="btn btn-secondary" onclick="reloadAll()">&#49352;&#47196;&#44256;&#52840;</button></div></header><div class="tab-bar"><button class="tab-btn active" onclick="switchTab('gallery',this)">&#47004;&#46377; &#44068;&#47084;&#47532;</button><button class="tab-btn" onclick="switchTab('events',this)">&#69;&#118;&#101;&#110;&#116;&#115;</button></div><div id="tab-gallery" class="tab-pane active"><div class="gallery-layout"><div class="list-panel"><div class="list-header"><h2>&#47004;&#46377; &#51089;&#50629; &#47785;&#47197; <span id="work-count" style="color:var(--accent-dark)"></span></h2></div><div class="list-body" id="list-body"></div><button class="add-btn" onclick="addWork()">&#43; &#51089;&#50629; &#52628;&#44032;</button></div><div class="edit-panel" id="edit-panel"></div></div></div><div id="tab-events" class="tab-pane"><div class="events-layout"><div class="event-save-row"><h2 style="font-size:1em">&#78;&#69;&#88;&#84; &#69;&#86;&#69;&#78;&#84; &#51221;&#48372;</h2><button class="btn btn-primary" onclick="saveEvents()">&#69;&#118;&#101;&#110;&#116;&#115; &#51200;&#51109;</button></div><div id="events-editor"></div></div></div><div class="toast" id="toast"></div><script>
let works=[],events=[],selectedIdx=null,dragSrcIdx=null;
const CATEGORIES=[{value:'illustration',label:'&#51068;&#47084;&#49828;&#53944;',detailLabel:'Original Artwork',badgeClass:'badge-illustration',color:'#e8e4ec'},{value:'uiux',label:'UI/UX',detailLabel:'UI/UX Design',badgeClass:'badge-uiux',color:'#e4eaee'},{value:'graphic',label:'&#44536;&#47000;&#54589; &#46356;&#51088;&#51064;',detailLabel:'Graphic Design',badgeClass:'badge-graphic',color:'#eee8e4'}];
const MSG={"loading":"불러오는 중...","loaded":"불러옴","loadFailed":"로드 실패","saving":"저장 중...","saved":"저장 완료","saveFailed":"저장 실패","galleryLoadFailed":"랜딩 갤러리 로드 실패: ","gallerySaved":"랜딩 갤러리가 저장되었습니다.","saveError":"저장 실패: ","deleteConfirm":"작업을 삭제할까요?","deleteNotice":"삭제했습니다. 랜딩 갤러리 저장 버튼을 눌러야 반영됩니다.","orderNotice":"순서가 변경되었습니다. 랜딩 갤러리 저장 버튼을 눌러야 반영됩니다.","eventsLoadFailed":"Events 로드 실패: ","eventsSaved":"Events가 저장되었습니다.","eventsSaveFailed":"Events 저장 실패: ","eventRequired":"행사는 최소 1개가 필요합니다."};
function getCat(type){return CATEGORIES.find(c=>c.value===type)||CATEGORIES[0];}function imgSrc(filename){if(!filename)return '';if(/^https?:\/\//.test(filename))return filename;return '/img/'+filename.replace(/^img\//,'');}function esc(str){return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function setStatus(msg,type){const el=document.getElementById('save-status');el.textContent=msg;el.className='save-status'+(type?' '+type:'');}function showToast(msg,isError){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(isError?' error':'');setTimeout(()=>el.className='toast',2800);}function switchTab(name,btn){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById('tab-'+name).classList.add('active');}
async function reloadAll(){setStatus(MSG.loading);await Promise.all([reloadWorks(),reloadEvents()]);}
async function reloadWorks(){try{const res=await fetch('/api/works');const data=await res.json();if(!data.ok)throw new Error(data.error);works=data.works.map(w=>({...w,type:w.type||'illustration',color:w.color||getCat(w.type||'illustration').color,tags:w.tags||[]}));renderList();selectedIdx=works.length?0:null;selectedIdx===null?renderEmptyEditor():renderEditor(selectedIdx);setStatus(MSG.loaded,'saved');}catch(e){setStatus(MSG.loadFailed,'error');showToast(MSG.galleryLoadFailed+e.message,true);}}
async function saveWorks(){setStatus(MSG.saving);try{const res=await fetch('/api/works',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({works})});const data=await res.json();if(!data.ok)throw new Error(data.error);setStatus(MSG.saved,'saved');showToast(MSG.gallerySaved);}catch(e){setStatus(MSG.saveFailed,'error');showToast(MSG.saveError+e.message,true);}}
function renderList(){const body=document.getElementById('list-body');document.getElementById('work-count').textContent='('+works.length+')';body.innerHTML=works.length?works.map((w,i)=>{const cat=getCat(w.type),thumb=imgSrc(w.thumb);return '<div class="work-item '+(i===selectedIdx?'active':'')+'" draggable="true" onclick="selectWork('+i+')" ondragstart="onDragStart(event,'+i+')" ondragover="onDragOver(event,'+i+')" ondrop="onDrop(event,'+i+')" ondragend="onDragEnd()"><span class="work-num">'+String(i+1).padStart(2,'0')+'</span>'+(thumb?'<img class="work-thumb-preview" src="'+thumb+'" alt="'+esc(w.title)+'"><div class="work-thumb-color" style="background:'+w.color+';display:none"></div>':'<div class="work-thumb-color" style="background:'+w.color+'"></div>')+'<div class="work-info"><div class="work-item-title">'+esc(w.title||'&#51228;&#47785; &#50630;&#51020;')+'</div><div class="work-item-sub">'+esc(w.year||'')+'</div></div><span class="work-item-badge '+cat.badgeClass+'">'+cat.label+'</span><span class="drag-handle">::</span></div>';}).join(''):'<div class="list-empty">&#51089;&#50629;&#51060; &#50630;&#49845;&#45768;&#45796;.</div>';}
function selectWork(i){selectedIdx=i;renderList();renderEditor(i);}function renderEmptyEditor(){document.getElementById('edit-panel').innerHTML='<div class="edit-empty"><div class="edit-empty-icon">+</div><p>&#50812;&#51901;&#50640;&#49436; &#51089;&#50629;&#51012; &#49440;&#53469;&#54616;&#44144;&#45208; &#49352; &#51089;&#50629;&#51012; &#52628;&#44032;&#54616;&#49464;&#50836;.</p></div>';}
function renderEditor(i){const w=works[i],hasShop=!!w.shopUrl;document.getElementById('edit-panel').innerHTML='<div class="edit-form"><div class="edit-title-row"><h2>&#51089;&#50629; &#54200;&#51665;</h2><button class="btn btn-primary" onclick="saveWorks()">&#47004;&#46377; &#44068;&#47084;&#47532; &#51200;&#51109;</button></div><div class="field-group"><label class="field-label">&#51228;&#47785; <span>*</span></label><input class="field-input" value="'+esc(w.title)+'" oninput="updateField('+i+',\'title\',this.value)"></div><div class="field-row"><div class="field-group"><label class="field-label">&#49436;&#48652;&#53440;&#51060;&#53952;</label><input class="field-input" value="'+esc(w.sub)+'" oninput="updateField('+i+',\'sub\',this.value)"></div><div class="field-group"><label class="field-label">&#50672;&#46020;</label><input class="field-input" value="'+esc(w.year)+'" oninput="updateField('+i+',\'year\',this.value)"></div></div><div class="field-row"><div class="field-group"><label class="field-label">&#52852;&#53580;&#44256;&#47532; &#53468;&#44536;</label><select class="field-select" onchange="updateColorByType('+i+',this.value)">'+CATEGORIES.map(c=>'<option value="'+c.value+'" '+(w.type===c.value?'selected':'')+'>'+c.label+'</option>').join('')+'</select></div><div class="field-group"><label class="field-label">&#45824;&#54364; &#49353;&#49345;</label><div class="color-row"><div class="color-swatch" style="background:'+w.color+'"><input type="color" value="'+w.color+'" oninput="updateField('+i+',\'color\',this.value);this.parentElement.style.background=this.value"></div><input class="field-input" value="'+esc(w.color)+'" oninput="updateField('+i+',\'color\',this.value)"></div></div></div><div class="field-row"><div class="field-group"><label class="field-label">&#50040;&#45348;&#51068; &#54028;&#51068;&#47749;</label><input class="field-input" value="'+esc(w.thumb)+'" oninput="updateField('+i+',\'thumb\',this.value);updateImgPreview(\'thumb-preview\',this.value)"><div class="preview-row">'+previewHtml('thumb-preview',w.thumb,'&#50040;&#45348;&#51068;')+'</div></div><div class="field-group"><label class="field-label">&#50896;&#48376; &#54028;&#51068;&#47749;</label><input class="field-input" value="'+esc(w.image)+'" oninput="updateField('+i+',\'image\',this.value);updateImgPreview(\'image-preview\',this.value)"><div class="preview-row">'+previewHtml('image-preview',w.image,'&#50896;&#48376;')+'</div></div></div><div class="field-group"><label class="field-label">&#49444;&#47749;</label><textarea class="field-textarea" oninput="updateField('+i+',\'desc\',this.value)">'+esc(w.desc)+'</textarea></div><div class="field-group"><label class="shop-toggle"><input type="checkbox" '+(hasShop?'checked':'')+' onchange="toggleShop('+i+',this.checked)"><span>&#44396;&#47588; &#47553;&#53356; &#49324;&#50857;</span></label><div id="shop-url-wrap" style="display:'+(hasShop?'block':'none')+'"><input class="field-input" value="'+esc(w.shopUrl)+'" oninput="updateField('+i+',\'shopUrl\',this.value)" placeholder="https://..."></div></div><button class="btn btn-danger" onclick="deleteWork('+i+')">&#51089;&#50629; &#49325;&#51228;</button></div>';}
function previewHtml(id,file,label){return file?'<div><img id="'+id+'" class="img-preview" src="'+imgSrc(file)+'" alt="'+label+'"><div class="field-hint">'+label+'</div></div>':'<div id="'+id+'" class="img-preview-placeholder">&#48120;&#47532;&#48372;&#44592; &#50630;&#51020;</div>';}function updateImgPreview(id,file){const el=document.getElementById(id);if(!el)return;el.outerHTML=file?'<img id="'+id+'" class="img-preview" src="'+imgSrc(file)+'" alt="preview">':'<div id="'+id+'" class="img-preview-placeholder">&#48120;&#47532;&#48372;&#44592; &#50630;&#51020;</div>';}
function updateField(i,key,val){works[i][key]=val;if(['title','sub','year','thumb','type'].includes(key))renderList();document.querySelectorAll('.work-item')[i]?.classList.add('active');}function updateColorByType(i,type){const cat=getCat(type);works[i].type=type;works[i].color=cat.color;renderList();renderEditor(i);}function toggleShop(i,on){document.getElementById('shop-url-wrap').style.display=on?'block':'none';if(!on)works[i].shopUrl='';}function addWork(){works.push({title:'',sub:'',year:String(new Date().getFullYear()),type:'illustration',color:'#e8e4ec',thumb:'',image:'',tags:[],shopUrl:'',desc:''});selectWork(works.length-1);}function deleteWork(i){if(!confirm(MSG.deleteConfirm))return;works.splice(i,1);selectedIdx=null;renderList();renderEmptyEditor();showToast(MSG.deleteNotice);}function onDragStart(e,i){dragSrcIdx=i;e.dataTransfer.effectAllowed='move';setTimeout(()=>document.querySelectorAll('.work-item')[i]?.classList.add('dragging'),0);}function onDragOver(e,i){e.preventDefault();document.querySelectorAll('.work-item').forEach((el,idx)=>el.classList.toggle('drag-over',idx===i&&idx!==dragSrcIdx));}function onDrop(e,i){e.preventDefault();if(dragSrcIdx===null||dragSrcIdx===i)return;const moved=works.splice(dragSrcIdx,1)[0];works.splice(i,0,moved);selectWork(i);showToast(MSG.orderNotice);}function onDragEnd(){dragSrcIdx=null;document.querySelectorAll('.work-item').forEach(el=>el.classList.remove('dragging','drag-over'));}
function defaultEvent(){return{title:'',startDate:'',endDate:'',titleUrl:'',venue:'',booth:'',items:'',salesStatusText:'',shopButtonLabel:'&#44396;&#47588;&#54616;&#44592;',shopAvailable:false,shopUrl:'',previewImage:'',thumbnailUrl:'',note:'',noticeUrl:''};}async function reloadEvents(){try{const res=await fetch('/api/events');const data=await res.json();if(!data.ok)throw new Error(data.error);events=data.events?.length?data.events:[defaultEvent()];renderEventEditor();}catch(e){showToast(MSG.eventsLoadFailed+e.message,true);}}async function saveEvents(){setStatus(MSG.saving);try{const res=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({events})});const data=await res.json();if(!data.ok)throw new Error(data.error);setStatus(MSG.saved,'saved');showToast(MSG.eventsSaved);}catch(e){setStatus(MSG.saveFailed,'error');showToast(MSG.eventsSaveFailed+e.message,true);}}
function renderEventEditor(){document.getElementById('events-editor').innerHTML='<div class="events-form">'+events.map((ev,i)=>eventCard(ev,i)).join('')+'<div class="event-list-actions"><button class="btn btn-secondary" onclick="addEvent()">&#54665;&#49324; &#52628;&#44032;</button></div></div>';}function eventCard(ev,i){const thumb=imgSrc(ev.previewImage);return '<div class="event-card"><div class="edit-title-row"><h2>&#54665;&#49324; '+(i+1)+'</h2><button class="btn btn-danger" onclick="deleteEvent('+i+')">&#49325;&#51228;</button></div><div class="field-group"><label class="field-label">&#54665;&#49324; &#51060;&#47492;</label><input class="field-input" value="'+esc(ev.title)+'" oninput="updateEvent('+i+',\'title\',this.value)"></div><div class="field-row"><div class="field-group"><label class="field-label">&#49884;&#51089;&#51068;</label><input class="field-input" type="date" value="'+esc(ev.startDate)+'" oninput="updateEvent('+i+',\'startDate\',this.value)"></div><div class="field-group"><label class="field-label">&#51333;&#47308;&#51068;</label><input class="field-input" type="date" value="'+esc(ev.endDate)+'" oninput="updateEvent('+i+',\'endDate\',this.value)"></div></div><div class="field-group"><label class="field-label">&#51228;&#47785; &#47553;&#53356;</label><input class="field-input" value="'+esc(ev.titleUrl)+'" oninput="updateEvent('+i+',\'titleUrl\',this.value)"></div><div class="field-row"><div class="field-group"><label class="field-label">&#51109;&#49548;</label><input class="field-input" value="'+esc(ev.venue)+'" oninput="updateEvent('+i+',\'venue\',this.value)"></div><div class="field-group"><label class="field-label">&#48512;&#49828;</label><input class="field-input" value="'+esc(ev.booth)+'" oninput="updateEvent('+i+',\'booth\',this.value)"></div></div><div class="field-group"><label class="field-label">ITEMS</label><input class="field-input" value="'+esc(ev.items)+'" oninput="updateEvent('+i+',\'items\',this.value)"></div><div class="field-group"><label class="field-label">STATUS</label><input class="field-input" value="'+esc(ev.salesStatusText)+'" oninput="updateEvent('+i+',\'salesStatusText\',this.value)"></div><div class="field-group"><label class="shop-toggle"><input type="checkbox" '+(ev.shopAvailable?'checked':'')+' onchange="updateEvent('+i+',\'shopAvailable\',this.checked)"><span>&#44396;&#47588;&#54616;&#44592; &#48260;&#53948; &#54876;&#49457;&#54868;</span></label><input class="field-input" value="'+esc(ev.shopUrl)+'" oninput="updateEvent('+i+',\'shopUrl\',this.value)" placeholder="&#44396;&#47588; &#47553;&#53356;"></div><div class="field-row"><div class="field-group"><label class="field-label">&#50040;&#45348;&#51068; &#54028;&#51068;&#47749;</label><input class="field-input" value="'+esc(ev.previewImage)+'" oninput="updateEvent('+i+',\'previewImage\',this.value);updateEventPreview(this.value)"><div class="preview-row">'+(thumb?'<img id="event-thumb-preview" class="img-preview-wide" src="'+thumb+'" alt="thumb">':'<div id="event-thumb-preview" class="img-preview-wide-placeholder">&#50040;&#45348;&#51068; &#48120;&#47532;&#48372;&#44592;</div>')+'</div></div><div class="field-group"><label class="field-label">&#50040;&#45348;&#51068; &#47553;&#53356;</label><input class="field-input" value="'+esc(ev.thumbnailUrl)+'" oninput="updateEvent('+i+',\'thumbnailUrl\',this.value)"></div></div><div class="field-group"><label class="field-label">&#44277;&#51648; &#47553;&#53356;</label><input class="field-input" value="'+esc(ev.noticeUrl)+'" oninput="updateEvent('+i+',\'noticeUrl\',this.value)"></div></div>';}
function updateEvent(i,key,val){events[i][key]=val;}function updateEventPreview(file){const el=document.getElementById('event-thumb-preview');if(!el)return;el.outerHTML=file?'<img id="event-thumb-preview" class="img-preview-wide" src="'+imgSrc(file)+'" alt="thumb">':'<div id="event-thumb-preview" class="img-preview-wide-placeholder">&#50040;&#45348;&#51068; &#48120;&#47532;&#48372;&#44592;</div>';}function addEvent(){events.push(defaultEvent());renderEventEditor();}function deleteEvent(i){if(events.length<=1){showToast(MSG.eventRequired,true);return;}events.splice(i,1);renderEventEditor();}reloadAll();
</script></body></html>
